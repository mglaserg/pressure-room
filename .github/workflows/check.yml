name: Verify Pressure Room
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
          python-version: '3.11'
      - run: uv sync --project backend --locked
      - run: uv run --project backend pytest backend/tests
      - run: uv export --project backend --locked --no-dev --no-emit-project -o backend/requirements.lock && git diff --exit-code backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
