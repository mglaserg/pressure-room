[project]
name = "pressure-room-api"
version = "0.5.7"
description = "Pressure Room FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "reportlab>=4.4",
  "httpx>=0.28",
  "cryptography>=46",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]