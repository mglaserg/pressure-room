version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "Preparing Pressure Room API"
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install .
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
